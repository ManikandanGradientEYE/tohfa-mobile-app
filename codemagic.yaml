workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tohfa.app.tohfa
      vars:
        APP_STORE_APPLE_ID: 6748937269
      flutter: 3.32.6
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Force clean CocoaPods install
        # Without this, Codemagic can reuse a cached ios/Pods directory from a
        # previous build, silently ignoring Podfile changes (e.g. the
        # permission_handler PERMISSION_* scoping in post_install). This step
        # guarantees every build actually re-resolves and recompiles pods.
        script: |
          rm -rf ios/Pods ios/Podfile.lock

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Determine next build number from App Store Connect
        # Auto-fetches the highest build number Apple has already seen for
        # this app and increments it, so you never manually edit
        # project.pbxproj or hit "bundle version already used" again.
        script: |
          #!/bin/sh
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Latest build number on App Store Connect: $LATEST_BUILD_NUMBER"
          echo "Using new build number: $NEW_BUILD_NUMBER"
          echo "NEW_BUILD_NUMBER=$NEW_BUILD_NUMBER" >> "$CM_ENV"

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.0.8 \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Replace with the name of your App Store Connect integration,
        # configured under Codemagic → Team settings → Integrations →
        # Developer Portal (this is the same API key you already set up).
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
